---
template:
  - light:
      - unique_id: all_lights_template
        turn_off:
          - target:
              # All lights except the Bambu Lab X1C chamber light (and this template light itself)
              entity_id: >
                {{ states.light | map(attribute='entity_id')
                   | reject('in', ['light.all_lights', 'light.x1c_00m09a363000342_chamber_light'])
                   | list }}
            action: light.turn_off
        turn_on:
          - target:
              # All lights except the Bambu Lab X1C chamber light (and this template light itself)
              entity_id: >
                {{ states.light | map(attribute='entity_id')
                   | reject('in', ['light.all_lights', 'light.x1c_00m09a363000342_chamber_light'])
                   | list }}
            action: light.turn_on
        default_entity_id: light.all_lights
        name: All Lights
        state: >
          {{ states.light | selectattr('state', 'eq', 'on')
             | map(attribute='entity_id')
             | reject('in', ['light.all_lights', 'light.x1c_00m09a363000342_chamber_light'])
             | list | count > 0 }}
