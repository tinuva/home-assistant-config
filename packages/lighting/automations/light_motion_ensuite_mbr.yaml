---
timer:
  # When calling the start service on a timer that is already running, it resets
  # the duration it will need to finish and restart the timer without triggering
  # a canceled or finished event. This, for example, makes it easy to create
  # timed lights that get triggered by motion. Starting a timer triggers a
  # started event unless the timer is paused, in that case, it triggers a
  # restarted event.
  motion_mbr_to_ens:
    name: Motion MBR to ENS
    duration: "00:00:10"
    restore: true

  # Auto-off timer for the mainbed ensuite light.
  # Default 5 minutes, shortened to 30 seconds while in sleep mode.
  mainbed_ensuite:
    name: Mainbed Ensuite Light
    duration: "00:05:00"
    restore: true

automation:
  # Motion = Turn on
  - alias: MBR to ENS motion
    trigger:
      - platform: state
        entity_id: binary_sensor.main_bedroom_pir
        to: "on"
    condition:
      - condition: state # 'night' condition: from sunset until sunrise
        entity_id: sun.sun
        state: "below_horizon"
      - condition: or
        conditions:
          - condition: state
            entity_id: timer.morning_routine
            state: "active"
          - condition: state
            entity_id: binary_sensor.mainbedroom_sleep_mode
            state: "off"
    action:
      - service: timer.start
        data:
          entity_id: timer.motion_mbr_to_ens

  - alias: Turn on MainBathroom light with motion_mbr_to_ens timer
    trigger:
      - platform: state
        entity_id: binary_sensor.ensuite_pir
        to: "on"
    condition:
      - condition: state # Alarm armed home only
        entity_id: timer.motion_mbr_to_ens
        state: "active"
    action:
      - service: timer.cancel
        data:
          entity_id: timer.motion_mbr_to_ens
      - service: automation.trigger
        data:
          skip_condition: true
          entity_id: automation.turn_on_main_bathroom_lights_fan

  # Timer end = Turn off
  - alias: Turn off mainbed ensuite light after timer finish
    trigger:
      platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.mainbed_ensuite
    action:
      - condition: state
        entity_id: timer.morning_routine
        state: "idle"
      - service: light.turn_off
        data:
          entity_id: light.main_bedroom_ensuite_bathroom_mainbed_ensuite

  # Light on (manual or automated) = start/restart the auto-off timer
  - alias: Start mainbed ensuite light timer on turn on
    initial_state: true
    trigger:
      - platform: state
        entity_id: light.main_bedroom_ensuite_bathroom_mainbed_ensuite
        to: "on"
      # Motion while the light is already on refreshes the timer
      - platform: state
        entity_id: binary_sensor.ensuite_pir
        to: "on"
    condition:
      - condition: state
        entity_id: light.main_bedroom_ensuite_bathroom_mainbed_ensuite
        state: "on"
    action:
      - service: timer.start
        data:
          entity_id: timer.mainbed_ensuite
          duration: >
            {% if is_state('binary_sensor.mainbedroom_sleep_mode', 'on') %}
              30
            {% else %}
              {{5*60|int}}
            {% endif %}

  # Light off = cancel the timer so a stale finish cannot fire later
  - alias: Cancel mainbed ensuite light timer on turn off
    trigger:
      - platform: state
        entity_id: light.main_bedroom_ensuite_bathroom_mainbed_ensuite
        to: "off"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: timer.mainbed_ensuite
            state: "idle"
    action:
      - service: timer.cancel
        data:
          entity_id: timer.mainbed_ensuite

  # Entering/leaving sleep mode while the light is on re-evaluates the duration
  - alias: Adjust mainbed ensuite light timer on sleep mode change
    trigger:
      - platform: state
        entity_id: binary_sensor.mainbedroom_sleep_mode
        to:
          - "on"
          - "off"
    condition:
      - condition: state
        entity_id: light.main_bedroom_ensuite_bathroom_mainbed_ensuite
        state: "on"
      - condition: state
        entity_id: timer.mainbed_ensuite
        state: "active"
    action:
      - service: timer.start
        data:
          entity_id: timer.mainbed_ensuite
          duration: >
            {% if is_state('binary_sensor.mainbedroom_sleep_mode', 'on') %}
              30
            {% else %}
              {{5*60|int}}
            {% endif %}
